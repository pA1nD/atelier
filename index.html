<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Atelier</title>

  <!-- The shell ships zero pixels and makes zero visual assumptions. All
       visual identity — fonts, colors, rail, topbar, banner, favicon,
       theme-color, icon set — lives in a chrome-slot module (any global
       module exporting `meta = { isChrome: true }`). There is no default chrome.
       client.jsx dynamic-imports the active chrome and renders it as the root;
       with none installed it renders a plain "add a chrome" screen.

       The one inline rule below is non-visual: a margin reset plus a
       color-scheme hint, so the brief pre-chrome paint follows the OS
       light/dark setting instead of forcing a color. -->
  <style>html{color-scheme:light dark}html,body{margin:0}</style>

  <!-- Render-blocking link to the active chrome's stylesheet, injected by
       atelier/server.js based on `chromeQid`. Pre-loading here (rather than
       letting the chrome's JS IIFE inject it later) eliminates a flash of
       unstyled content before the chrome's utility classes apply. The chrome's
       IIFE checks for this id and skips a duplicate injection. Empty when no
       chrome is installed or the active chrome has no styles.css. -->
  <!--__ATELIER_CHROME_STYLES__-->

  <!-- React + ReactDOM are the only ambient runtime the shell provides —
       modules are React components sharing this one instance. Every visual
       dependency (icon libraries, fonts, …) belongs to the chrome, which
       injects its own. Served by the shell from node_modules (version pinned
       in package.json), so a checkout boots offline — no CDN at runtime. -->
  <script src="/assets/react.js"></script>
  <script src="/assets/react-dom.js"></script>

  <!-- Injected by atelier/server.js per request:
       window.__ATELIER__ = { mode, user, chromeQid, ... }
       Or, on the unauth handoff lane:
       window.__ATELIER__ = { takeover, moduleBundle } -->
  <script>/*__ATELIER_BOOTSTRAP__*/</script>

  <!-- Import map for chrome-published bare specifiers. Server replaces
       the placeholder with `<script type="importmap">{...}</script>` when
       the active chrome ships a kit.js (or any future at-atelier-prefixed
       file). Must appear BEFORE the first <script type="module"> below;
       once parsed, the map applies to every subsequent static + dynamic
       import (so module bundles loaded later via import() resolve
       `@atelier/kit` correctly). -->
  <!--__ATELIER_IMPORTMAP__-->
</head>
<body>
  <div id="root"></div>

  <!-- Shell — an ES module served at /assets/client.js. Wires the shared
       WebSocket bridge (window.__atelier.subscribe), URL routing,
       dynamic-imports the chrome and module bundles, and renders. The chrome
       owns all visual bytes. -->
  <script type="module" src="/assets/client.js"></script>
</body>
</html>
