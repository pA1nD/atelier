<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Atelier</title>

  <!-- Atelier 0.3 shell shape:
         The shell ships zero pixels. Visual concerns — fonts, colors, rail,
         topbar, banner, takeover wrapping — live entirely in a chrome-slot
         module (`atelier/builtin-chrome/` by default, or any global-workspace
         module exporting `meta = { chrome: true }`). The shell's client.jsx
         dynamic-imports the chrome bundle and renders it as the root.

         The single inline <style> below sets only the body background so
         users don't see a white flash before the chrome's stylesheet loads.
         Everything else is the chrome's job. -->

  <!-- Boot-paint defaults — favicon, theme-color, body bg. All of these
       belong to the chrome (visual identity), but the chrome bundle takes
       ~50-100ms to parse on a cold load. The defaults below paint during
       that window so the browser tab + OS chrome have an icon and color
       before the chrome's IIFE replaces them. Both the builtin and any
       custom chrome rewrite these on module load. -->
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1" fill="%23d79921"/><rect x="13" y="3" width="8" height="8" rx="1" fill="%23689d6a"/><rect x="3" y="13" width="8" height="8" rx="1" fill="%23689d6a"/><rect x="13" y="13" width="8" height="8" rx="1" fill="%23d79921"/></svg>' />
  <meta name="theme-color" content="#1d2021" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f7f5f2" media="(prefers-color-scheme: light)" />

  <style>html,body{margin:0;background:#1d2021}</style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

  <!-- Injected by atelier/server.js per request:
       window.__ATELIER__ = { mode, env, user, chromeQid }
       Or, on the unauth handoff lane:
       window.__ATELIER__ = { takeover, moduleBundle } -->
  <script>/*__ATELIER_BOOTSTRAP__*/</script>

  <!-- Import map for chrome-published bare specifiers. Server replaces
       the placeholder with `<script type="importmap">{...}</script>` when
       the active chrome ships a kit.js (or any future at-atelier-prefixed
       file). Must appear BEFORE the first <script type="module"> below;
       once parsed, the map applies to every subsequent static + dynamic
       import (so module bundles loaded later via import() resolve
       `@atelier/kit` correctly). -->
  <!--__ATELIER_IMPORTMAP__-->
</head>
<body>
  <div id="root"></div>

  <!-- Shell — an ES module served at /assets/client.js. Wires the shared
       WebSocket bridge (window.__atelier.subscribe), the callModule registry,
       URL routing, dynamic-imports the chrome and module bundles, and renders.
       The chrome owns all visual bytes. -->
  <script type="module" src="/assets/client.js"></script>
</body>
</html>
